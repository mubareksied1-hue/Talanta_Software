
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Calculator</title>
	<style>
		body{font-family:Arial,Helvetica,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#f3f4f6}
		.calc{background:#fff;padding:16px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.08);width:300px}
		.display{height:48px;margin-bottom:8px;padding:8px;border:1px solid #e5e7eb;border-radius:6px;font-size:20px;text-align:right;overflow:hidden}
		.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
		button{padding:14px;font-size:16px;border:0;border-radius:6px;cursor:pointer;background:#eef2ff}
		button.op{background:#ffd966}
		button.equal{grid-column:span 2;background:#4f46e5;color:#fff}
		button.clear{background:#f87171;color:#fff}
	</style>
</head>
<body>
	<div class="calc">
		<div id="display" class="display">0</div>
		<div class="keys">
			<button class="clear" data-action="clear">C</button>
			<button data-action="back">⌫</button>
			<button class="op" data-value="%">%</button>
			<button class="op" data-value="/">÷</button>

			<button data-value="7">7</button>
			<button data-value="8">8</button>
			<button data-value="9">9</button>
			<button class="op" data-value="*">×</button>

			<button data-value="4">4</button>
			<button data-value="5">5</button>
			<button data-value="6">6</button>
			<button class="op" data-value="-">−</button>

			<button data-value="1">1</button>
			<button data-value="2">2</button>
			<button data-value="3">3</button>
			<button class="op" data-value="+">+</button>

			<button data-value="0">0</button>
			<button data-value=".">.</button>
			<button class="equal" data-action="equals">=</button>
		</div>
	</div>

	<script>
		const display = document.getElementById('display');
		let expr = '';

		function update(){ display.textContent = expr || '0'; }

		document.querySelectorAll('button').forEach(b=>{
			b.addEventListener('click',()=>{
				const v = b.getAttribute('data-value');
				const a = b.getAttribute('data-action');
				if(a==='clear'){ expr=''; update(); return }
				if(a==='back'){ expr = expr.slice(0,-1); update(); return }
				if(a==='equals'){ try{ // evaluate safely
						// disallow letters
						if(/[a-zA-Z]/.test(expr)) throw 1;
						// replace × ÷ characters if any
						const safe = expr.replace(/×/g,'*').replace(/÷/g,'/');
						const result = Function('return ('+safe+')')();
						expr = String(result);
					}catch(e){ expr='Error' }
					update(); return }
				// append value
				// prevent multiple dots in a number
				if(v==='.'){
					const parts = expr.split(/[^0-9.]/);
					if(parts[parts.length-1].includes('.')) return;
				}
				expr += v;
				update();
			})
		})
	</script>
</body>
</html>
