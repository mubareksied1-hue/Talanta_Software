<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Calculator</title>
	<style>
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			font-family: Arial, sans-serif;
			background: #f2f6f8;
		}
		.calculator {
			width: min(92vw, 360px);
			padding: 22px;
			border-radius: 18px;
			background: #172b4d;
			box-shadow: 0 12px 30px #0003;
		}
		h1 { margin: 0 0 16px; color: #fff; text-align: center; font-size: 1.5rem; }
		#display {
			width: 100%;
			margin-bottom: 16px;
			padding: 16px;
			border: 0;
			border-radius: 10px;
			background: #fff;
			color: #172b4d;
			font-size: 2rem;
			text-align: right;
		}
		.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
		button {
			min-height: 58px;
			border: 0;
			border-radius: 10px;
			background: #e8eef2;
			color: #172b4d;
			cursor: pointer;
			font-size: 1.2rem;
		}
		button:hover { background: #cbd8df; }
		.operator, .equals { background: #ffb703; }
		.clear { background: #ef476f; color: #fff; }
		.equals { grid-row: span 2; }
		.zero { grid-column: span 2; }
	</style>
</head>
<body>
	<main class="calculator" aria-label="Calculator">
		<h1>Calculator</h1>
		<input id="display" type="text" value="0" aria-label="Calculator display" readonly>
		<section class="keys">
			<button class="clear" data-action="clear">AC</button>
			<button data-action="delete">⌫</button>
			<button class="operator" data-value="%">%</button>
			<button class="operator" data-value="/">÷</button>
			<button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button>
			<button class="operator" data-value="*">×</button>
			<button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button>
			<button class="operator" data-value="-">−</button>
			<button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button>
			<button class="operator" data-value="+">+</button>
			<button class="zero" data-value="0">0</button><button data-value=".">.</button>
			<button class="equals" data-action="calculate">=</button>
		</section>
	</main>
	<script>
		const display = document.getElementById('display');
		let expression = '';
		document.querySelector('.keys').addEventListener('click', ({ target }) => {
			if (target.tagName !== 'BUTTON') return;
			const { value, action } = target.dataset;
			if (action === 'clear') expression = '';
			else if (action === 'delete') expression = expression.slice(0, -1);
			else if (action === 'calculate') {
				try { expression = String(Function(`"use strict"; return (${expression})`)()); }
				catch { expression = ''; display.value = 'Error'; return; }
			} else expression += value;
			display.value = expression || '0';
		});
	</script>
</body>
</html>
